<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        *, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
        }

        #gameHolder {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
        }

        #game {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            width: 100%;
            height: 100%;
        }

        #debugPanel {
            position: fixed;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);

            display: flex;
            flex-direction: column;
            gap: 4px;

            background: rgba(0,0,0,0.7);
            color: #00ff00;

            padding: 8px 12px;
            border: 1px solid #333;

            font-family: 'Courier New', monospace;
            font-size: 14px;

            z-index: 9999;
            max-width: 260px;
        }
    </style>
</head>
<body>
    <div id="gameHolder">
        <div id="game"></div>
    </div>

    <div id="debugPanel">
        <label>
            DEBUG:
            <input type="checkbox" id="debugToggle">
        </label>

        <label>
            SHOW MESHES:
            <input type="checkbox" id="showMeshesToggle">
        </label>

        <label>
            SHOW CAR BOUNDS:
            <input type="checkbox" id="showCarBoundsToggle">
        </label>

        <div id="fpsCounter">FPS: 0</div>
        <div id="meshCounter">MESHES: 0</div>
        <div id="triangleCounter">TRIANGLES: 0</div>
        <div id="gridMeshTriangles">TRIANGLES: 0</div>
        <div id="gridMeshes">Grids: 0</div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
