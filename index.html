<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        *, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        html,body{
            margin:0; padding:0; height:100%;
            background:#0a0a0a; display:flex; align-items:center; justify-content:center;
            font-family: 'Courier New', monospace;
        }
        #gameHolder{
            display:flex; flex-direction:column; align-items:center; gap:8px;
        }
        canvas{
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }
        #hint{
            color:#888; font-size:12px; max-width:960px; text-align:center;
        }
        #debugPanel {
            position: fixed;
            bottom: 10px;
            left: 10px;

            display: flex;
            flex-direction: column;
            gap: 4px;

            background: rgba(0,0,0,0.7);
            color: #00ff00;

            padding: 8px 12px;
            border: 1px solid #333;

            font-family: 'Courier New', monospace;
            font-size: 14px;

            z-index: 9999;
        }
    </style>

</head>
<body>
    <div id="gameHolder">
        <div id="game"></div>
        <div id="hint">A/D oder Pfeiltasten: Spur wechseln &nbsp;|&nbsp; W/S: Beschleunigen/Bremsen &nbsp;|&nbsp; Ziel: Strecke schaffen ohne Unfall &amp; ohne zu oft geblitzt zu werden</div>
    </div>

    <div id="debugPanel">
        <label>
            DEBUG:
            <input type="checkbox" id="debugToggle">
        </label>

        <label>
            SHOW MESHES:
            <input type="checkbox" id="showMeshesToggle">
        </label>

        <div id="fpsCounter">
            FPS: 0
        </div>

        <div id="meshCounter">
            MESHES: 0
        </div>

        <div id="triangleCounter">
            TRIANGLES: 0
        </div>

        <label>
            SPEED HACK:
            <input type="checkbox" id="speedToggle">
        </label>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
